# Hooks are run with prek (pinned in .mise.toml); install them with `mise run hooks:install`.
#
# - Generic file checks use prek's built-in implementations (`repo: builtin`), versioned with
#   the pinned prek release, so no hook repository has to be downloaded.
# - Language checks run the exact tool versions pinned in .mise.toml through `mise x`, so the
#   hook and CI use the same binaries. Git hooks run outside an activated shell; `mise` must be
#   on PATH (see docs/development.md).
# - Expensive checks (Bazel builds, tests, Renovate's container validator) are not hooks; they
#   run through `mise run verify` and in CI.
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
exclude: |
  (?x)^(
    bazel-[^/]+/.*|
    build/.*|
    dist/.*|
    MODULE\.bazel\.lock|
    mise\.lock|
    \.mise/locks/.*|
    LICENSE
  )$

repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-case-conflict
      - id: check-symlinks
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key
      - id: check-yaml
      - id: check-json
        exclude: \.jsonc$
      - id: check-jsonc
        files: \.jsonc$
      - id: check-toml

  - repo: local
    hooks:
      - id: google-java-format
        name: google-java-format
        entry: mise x -- google-java-format --replace
        language: system
        types: [java]
      - id: buildifier
        name: buildifier (format + lint)
        entry: mise x -- buildifier -mode=fix -lint=warn -warnings=-module-docstring
        language: system
        files: (^|/)(BUILD\.bazel|MODULE\.bazel|[^/]+\.bzl)$
      - id: shfmt
        name: shfmt
        entry: mise x -- shfmt -w -i 2 -ci
        language: system
        types: [shell]
      - id: shellcheck
        name: shellcheck
        entry: mise x -- shellcheck -x
        language: system
        types: [shell]
      - id: ruff-format
        name: ruff format
        entry: mise x -- ruff format
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: mise x -- ruff check
        language: system
        types: [python]
      - id: taplo
        name: taplo format
        entry: mise x -- taplo format
        language: system
        types: [toml]
      - id: markdownlint
        name: markdownlint-cli2
        entry: mise x -- markdownlint-cli2
        language: system
        types: [markdown]
      - id: actionlint
        name: actionlint
        entry: mise x -- actionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
      - id: release-please-config
        name: Release Please config schema and manifest consistency
        entry: mise x -- bash tools/scripts/check-config.sh
        language: system
        pass_filenames: false
        files: ^(release-please-config\.json|\.release-please-manifest\.json|version\.txt|examples/branch-review\.config)$
      - id: conventional-commit
        name: Conventional Commit message
        entry: mise x -- python3 -I tools/scripts/check_commit_msg.py
        language: system
        stages: [commit-msg]
